<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>てんしようちえん ジャンプ！</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff7e8;
        background-image: radial-gradient(ellipse at 30% 10%, #fdf8eb, transparent 70%), radial-gradient(ellipse at 80% 90%, #dfe8cf, transparent 60%);
        overscroll-behavior: none;
      }
      /* ゲーム領域：スクロール・ズーム・長押しメニュー・選択を抑止 */
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 縦向き案内（スマホ・タブレットの縦向き時のみ表示） */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        background: #fff7e8;
        background-image: radial-gradient(ellipse at 30% 10%, #fdf8eb, transparent 70%), radial-gradient(ellipse at 80% 90%, #dfe8cf, transparent 60%);
        color: #54786c;
        font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Noto Sans JP', sans-serif;
        font-weight: bold;
        font-size: 9vw;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #rotate .phone {
        width: 24vw;
        height: 42vw;
        border: 3vw solid #809e88;
        border-radius: 5vw;
        box-sizing: border-box;
        background: #e8f1e2;
        box-shadow: 0 4vw 0 -2vw #e8ddc5;
        animation: turn 2.4s ease-in-out infinite;
      }
      #rotate .phone::after { content: '★'; display: block; text-align: center; padding-top: 7vw; font-size: 12vw; color: #d0aa4e; }
      @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CW-cZw73.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite">
      <div class="phone" aria-hidden="true"></div>
      <div>よこむきにしてね！</div>
    </div>
  </body>
</html>
